task_plot_spec:
  spec_version: "0.2"
  meta:
    task_name: "Cyberball Task"
    mode: "existing"
    task_id: "T000034"
  figure:
    output:
      filename: "task_flow.png"
      dpi: 320
      width_in: 14.0
      auto_width: false
      background: "white"
    layout:
      max_conditions: 4
      screens_per_timeline: 4
      screen_overlap_ratio: 0.06
      screen_slope: 0.03
      screen_slope_deg: 12.0
      timeline_gap: 0.18
      screen_aspect_ratio: 1.50
      left_margin: 0.17
      right_margin: 0.03
      top_margin: 0.03
      bottom_margin: 0.05
      condition_label_gap: 0.014
      phase_label_pad: 0.01
      duration_label_gap: 0.006
      timeline_arrow_gap: 0.01
      timeline_arrow_screen_clearance: 0.007
      timeline_arrow_text_clearance: 0.01
      timeline_arrow_extra_per_screen: 0.015
      timeline_arrow_min_y: 0.02
      timeline_arrow_max_y: 0.96
  timelines:
    - condition: "inclusion"
      display_condition_label: "Inclusion"
      display_condition_note: "Participant keeps receiving passes."
      phases:
        - phase_name: "avatar_turn"
          display_phase_label: "Avatar Turn"
          duration_ms:
            range: [800, 1200]
          response_window_ms: null
          display_timing_label: "800-1200 ms"
          stim_ids: ["participant_node", "left_node", "right_node", "ball", "avatar_wait_prompt", "status_line"]
          stimulus_example:
            summary: "Avatar decides next target."
            modality: "visual"
            draw_hint: "shape"
            render_items:
              - kind: "shape"
                shape: "circle"
                color: "#4B5563"
                line_color: "#FCD34D"
                line_width: 1.7
                pos: [-0.78, 0.60]
                size: 1.6
              - kind: "shape"
                shape: "circle"
                color: "#4B5563"
                line_color: "#FFFFFF"
                line_width: 1.1
                pos: [0.78, 0.60]
                size: 1.6
              - kind: "shape"
                shape: "circle"
                color: "#2E5AAC"
                line_color: "#FFFFFF"
                line_width: 1.1
                pos: [0.00, -0.75]
                size: 1.7
              - kind: "shape"
                shape: "dot"
                color: "#FACC15"
                pos: [-0.78, 0.60]
                size: 1.2
              - kind: "text"
                text: "A"
                color: "#FFFFFF"
                pos: [-0.78, 0.60]
                height: 0.17
              - kind: "text"
                text: "B"
                color: "#FFFFFF"
                pos: [0.78, 0.60]
                height: 0.17
              - kind: "text"
                text: "You"
                color: "#FFFFFF"
                pos: [0.00, -0.75]
                height: 0.17
              - kind: "text"
                text: "A deciding..."
                color: "#D1D5DB"
                pos: [0.00, -0.10]
                height: 0.14
          notes: ""
        - phase_name: "toss_to_participant"
